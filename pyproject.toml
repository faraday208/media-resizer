[project]
name = "media-resizer"
version = "1.0.1"
description = "Media batch resize (Lanczos, aspect-preserving) — copy/in-place + undo (copy mode)"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["media", "image", "resize", "lanczos", "batch", "dataset", "ai"]
dependencies = [
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
