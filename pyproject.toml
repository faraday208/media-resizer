[project]
name = "image-resizer"
version = "0.1.0"
description = "Batch image resizing with Lanczos algorithm, aspect-ratio preserving"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "faraday208" }]
keywords = ["image", "resize", "lanczos", "batch", "dataset"]
dependencies = [
    "pillow>=10.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
